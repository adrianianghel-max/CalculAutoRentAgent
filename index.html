<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#00634c">
<title>CalculAutoRent</title>
<style>
  :root { --bg:#f5f7f6; --card:#fff; --text:#18211e; --muted:#5b6b65; --brand:#00634c; --brand-text:#fff; --line:#dbe3e0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1513; --card:#17201d; --text:#e7efec; --muted:#9db0a9; --brand:#2fa37f; --brand-text:#06130f; --line:#26332f; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  p { margin:0 0 16px; color:var(--muted); }
  a.go { display:block; text-align:center; text-decoration:none; background:var(--brand); color:var(--brand-text); font-weight:600; padding:14px; border-radius:10px; }
  a.go:focus-visible { outline:3px solid var(--text); outline-offset:2px; }
  ol { margin:20px 0 0; padding-left:20px; color:var(--muted); font-size:.92rem; }
</style>
</head>
<body>
<main>
  <h1>CalculAutoRent</h1>
  <p>Calcul reparație și lipsă de folosință RCA, corectare deviz.</p>
  <a class="go" href="app/" rel="noreferrer">Deschide aplicația</a>
  <ol>
    <li>Accesul necesită un cod unic primit pe e-mail la fiecare deschidere.</li>
    <li>Documentele sunt procesate doar în browserul tău.</li>
  </ol>
</main>
</body>
</html>
